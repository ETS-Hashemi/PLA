name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with extras
        run: pip install -e ".[api,dev,experiments]"
      - name: Run test suite
        run: pytest tests/ -v
      - name: Smoke-run CLI and examples
        run: |
          pla scenarios/scenario_context_aware_medical.json 1
          python examples/run_readme_scenario.py
          python examples/run_hybrid_demo.py

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-publishers poppler-utils
      - name: Compile workshop cut
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error workshop.tex
          pdflatex -interaction=nonstopmode -halt-on-error workshop.tex
      - name: Enforce the 4-6 page budget (workshop cut)
        run: |
          PAGES=$(pdfinfo paper/workshop.pdf | awk '/^Pages:/ {print $2}')
          echo "workshop pages: $PAGES"
          test "$PAGES" -ge 4 && test "$PAGES" -le 6
      - name: Compile journal manuscript (Overleaf project)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: |
            paper/workshop.pdf
            paper/main.pdf
