[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-logic-agent"
version = "0.1.0"
description = "Transparent probabilistic-logic agent: rule confidences, context-conditioned weights, symbolic gating, explanation traces"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Seyed Masoud Hashemi Ahmadi" }]
keywords = ["probabilistic logic", "symbolic reasoning", "explainable AI", "certainty factors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
api = ["flask>=2.3"]
dev = ["pytest>=7", "hypothesis>=6"]
experiments = ["scikit-learn>=1.3", "problog>=2.2"]  # pgmpy optional (heavy deps)

[project.scripts]
pla = "pla.cli:main"

[project.urls]
Repository = "https://github.com/ETS-Hashemi/PLA"

[tool.setuptools]
packages = ["pla"]
